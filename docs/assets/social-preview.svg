<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">Relaylead: a team of Claude Code sessions, in the background on your Mac</title>
  <rect width="1280" height="640" fill="#151618"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="210" font-size="104" font-weight="700" fill="#e8e6e1" letter-spacing="-2">Relay<tspan fill="#8fb0d8">lead</tspan></text>
    <text x="100" y="290" font-size="38" fill="#e8e6e1">A team of Claude Code sessions,</text>
    <text x="100" y="340" font-size="38" fill="#e8e6e1">in the background on your Mac.</text>
    <text x="100" y="408" font-size="26" fill="#9a978f">A lead splits the work, crew members do it,</text>
    <text x="100" y="444" font-size="26" fill="#9a978f">you answer before anything irreversible.</text>
    <rect x="96" y="500" width="430" height="60" rx="12" fill="#1e2023" stroke="#2d3035"/>
    <text x="122" y="539" font-size="26" fill="#6cc08b" font-family="ui-monospace, Menlo, monospace">$</text>
    <text x="148" y="539" font-size="26" fill="#e8e6e1" font-family="ui-monospace, Menlo, monospace">npm i -g relaylead</text>
    <text x="560" y="539" font-size="22" fill="#9a978f">macOS · Node 18+ · MIT · open source</text>
  </g>
  <g transform="translate(830 120)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">
    <ellipse cx="180" cy="160" rx="176" ry="150" fill="none" stroke="#77746c" stroke-width="2.5" stroke-dasharray="4 11"/>
    <path d="M180 108 C180 150 70 150 70 214" fill="none" stroke="#3a3e44" stroke-width="4"/>
    <path d="M180 108 L180 214" fill="none" stroke="#3a3e44" stroke-width="4"/>
    <path d="M180 108 C180 150 290 150 290 214" fill="none" stroke="#3a3e44" stroke-width="4"/>
    <rect x="115" y="62" width="130" height="50" rx="25" fill="#8fb0d8"/>
    <text x="180" y="94" text-anchor="middle" fill="#151618" font-weight="600" font-size="22">lead</text>
    <rect x="20" y="214" width="100" height="44" rx="22" fill="#151618" stroke="#6cc08b" stroke-width="2.5"/>
    <text x="70" y="243" text-anchor="middle" fill="#e8e6e1">crew</text>
    <rect x="130" y="214" width="100" height="44" rx="22" fill="#151618" stroke="#6cc08b" stroke-width="2.5"/>
    <text x="180" y="243" text-anchor="middle" fill="#e8e6e1">crew</text>
    <rect x="240" y="214" width="100" height="44" rx="22" fill="#151618" stroke="#e3b05a" stroke-width="2.5"/>
    <text x="290" y="243" text-anchor="middle" fill="#e8e6e1">crew</text>
    <rect x="100" y="296" width="160" height="30" fill="#151618"/>
    <text x="180" y="318" text-anchor="middle" fill="#9a978f">watcher (no AI)</text>
  </g>
</svg>
