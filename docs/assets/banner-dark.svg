<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Relaylead</title>
  <desc id="d">Relaylead runs a team of Claude Code sessions in the background on your Mac: a lead hands out the tasks, crew members do them on their own branches, a watcher keeps them moving.</desc>
  <rect width="1280" height="320" rx="24" fill="#151618"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="76" font-weight="700" fill="#e8e6e1" letter-spacing="-1.5">Relay<tspan fill="#8fb0d8">lead</tspan></text>
    <text x="74" y="204" font-size="27" fill="#e8e6e1">A team of Claude Code sessions, working in the</text>
    <text x="74" y="240" font-size="27" fill="#e8e6e1">background on your Mac, on a mission you set.</text>
    <text x="74" y="282" font-size="19" fill="#9a978f">You answer only before what cannot be undone.</text>
  </g>
  <g transform="translate(790 40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
    <rect x="0" y="0" width="420" height="240" rx="18" fill="#1e2023" stroke="#2d3035"/>
    <ellipse cx="210" cy="118" rx="194" ry="96" fill="none" stroke="#77746c" stroke-width="2" stroke-dasharray="3 9"/>
    <rect x="140" y="202" width="140" height="26" fill="#1e2023"/>
    <text x="210" y="220" text-anchor="middle" fill="#9a978f">watcher (no AI)</text>
    <path d="M210 86 C210 110 110 110 110 150" fill="none" stroke="#2d3035" stroke-width="3"/>
    <path d="M210 86 L210 150" fill="none" stroke="#2d3035" stroke-width="3"/>
    <path d="M210 86 C210 110 310 110 310 150" fill="none" stroke="#2d3035" stroke-width="3"/>
    <rect x="160" y="50" width="100" height="38" rx="19" fill="#8fb0d8"/>
    <text x="210" y="75" text-anchor="middle" fill="#151618" font-weight="600">lead</text>
    <g>
      <rect x="66" y="150" width="88" height="34" rx="17" fill="#151618" stroke="#6cc08b" stroke-width="2"/>
      <circle cx="84" cy="167" r="5" fill="#6cc08b"/>
      <text x="118" y="172" text-anchor="middle" fill="#e8e6e1">crew</text>
      <rect x="166" y="150" width="88" height="34" rx="17" fill="#151618" stroke="#6cc08b" stroke-width="2"/>
      <circle cx="184" cy="167" r="5" fill="#6cc08b"/>
      <text x="218" y="172" text-anchor="middle" fill="#e8e6e1">crew</text>
      <rect x="266" y="150" width="88" height="34" rx="17" fill="#151618" stroke="#e3b05a" stroke-width="2"/>
      <circle cx="284" cy="167" r="5" fill="#e3b05a"/>
      <text x="318" y="172" text-anchor="middle" fill="#e8e6e1">crew</text>
    </g>
  </g>
</svg>
