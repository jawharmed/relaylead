<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relaylead</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f0; --card: #ffffff; --line: #e3e0d8; --text: #1d1c1a; --muted: #6b675f;
    --accent: #3d5a80; --ok: #2f7d4f; --warn: #a8690d; --warn-bg: #fdf3df; --warn-line: #ecd29a;
    --bad: #b23a30; --idle: #8a867d; --info: #3d5a80; --track: #e8e5dd; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151618; --card: #1e2023; --line: #2d3035; --text: #e8e6e1; --muted: #9a978f;
      --accent: #8fb0d8; --ok: #6cc08b; --warn: #e3b05a; --warn-bg: #2b2415; --warn-line: #5a4720;
      --bad: #ef7d72; --idle: #77746c; --info: #8fb0d8; --track: #2d3035; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .summary { color: var(--muted); font-size: 14px; flex: 1; min-width: 200px; }
  .summary b { color: var(--text); font-weight: 600; }
  .quota { display: flex; gap: 20px; }
  .meter { width: 150px; }
  .meter .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
  .bar > i.warn { background: var(--warn); }
  .bar > i.bad { background: var(--bad); }
  main { padding: 24px 28px 40px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card-head { padding: 14px 16px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
  .card-head h2 { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .dir { grid-column: 1 / -1; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .s-working { --c: var(--ok); } .s-waiting, .s-paused { --c: var(--warn); } .s-handover, .s-starting { --c: var(--info); }
  .s-done { --c: var(--idle); } .s-stopped { --c: var(--bad); }
  .meta { display: flex; gap: 8px; align-items: center; padding: 0 16px 12px; color: var(--muted); font-size: 12.5px; }
  .tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; }
  .tag.high { color: var(--bad); border-color: currentColor; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); padding: 5px 12px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  button.stop { font-size: 12px; padding: 2px 10px; color: var(--muted); }
  button.stop:hover { color: var(--bad); border-color: var(--bad); }
  .question { margin: 0 12px 12px; padding: 12px 14px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; }
  .question .ask { font-weight: 600; }
  .question .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .options button { background: var(--card); }
  .options button.rec { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .other { display: flex; gap: 8px; margin-top: 10px; }
  .other input { flex: 1; min-width: 0; font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .other input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tasks { list-style: none; margin: 0; padding: 0 16px 14px; }
  .tasks li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .tasks li:first-child { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--idle)); align-self: center; }
  .t-running { --c: var(--ok); } .t-queued { --c: var(--warn); } .t-done, .t-delivered { --c: var(--info); } .t-failed { --c: var(--bad); } .t-todo { --c: var(--idle); }
  .tasks .name { flex: 1; overflow-wrap: anywhere; }
  .tasks .state { color: var(--muted); font-size: 12px; }
  .progress { padding: 0 16px 12px; }
  .progress .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  details.finished { margin-top: 28px; }
  details.finished summary { cursor: pointer; color: var(--muted); margin-bottom: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; }
  .empty code { background: var(--card); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 28px; font-size: 12px; color: var(--muted); background: var(--bg); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .live.off::before { background: var(--bad); }
  #toast { position: fixed; top: 16px; right: 16px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 420px; }
  #toast.show { opacity: 1; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } header, main { padding-left: 14px; padding-right: 14px; } }
</style>
</head>
<body>
<header>
  <h1>Relay<span>lead</span></h1>
  <div class="summary" id="summary"></div>
  <div class="quota" id="quota"></div>
</header>
<main id="main"></main>
<footer><span class="live" id="live"></span><span id="updated"></span></footer>
<div id="toast" role="status"></div>
<script>
const TOKEN = "__TOKEN__";
const TEXT = {
  en: { missions: 'active missions', questions: 'questions waiting', none: 'No mission yet.', start: 'Start one from Claude Code with /relaylead:launch or from a terminal with',
        finished: 'Finished', tasks: 'Tasks', stop: 'Stop', confirmStop: 'Stop mission {name}?', recommended: 'recommended', other: 'Other answer…', send: 'Send', fiveHour: '5 h', sevenDay: '7 days',
        paused: 'paused until {time}', live: 'live', offline: 'no connection', updated: 'updated {time}', sent: 'Answer sent', stopped: 'Mission stopped',
        done: 'done', todo: 'to do', running: 'running', queued: 'queued', delivered: 'delivered', failed: 'failed', progress: 'tasks delivered: {n} of {total}', prio: { low: 'low priority', normal: 'normal priority', high: 'high priority' },
        reset: 'resets {time}',
        states: {} },
  fr: { missions: 'missions actives', questions: 'questions en attente', none: 'Aucune mission pour l’instant.', start: 'Lancez-en une depuis Claude Code avec /relaylead:launch ou depuis un terminal avec',
        finished: 'Terminées', tasks: 'Tâches', stop: 'Arrêter', confirmStop: 'Arrêter la mission {name} ?', recommended: 'recommandée', other: 'Autre réponse…', send: 'Envoyer', fiveHour: '5 h', sevenDay: '7 jours',
        paused: 'en pause jusqu’à {time}', live: 'en direct', offline: 'connexion perdue', updated: 'mis à jour {time}', sent: 'Réponse envoyée', stopped: 'Mission arrêtée',
        done: 'terminée', todo: 'à faire', running: 'en cours', queued: 'en file', delivered: 'livrée', failed: 'échec', progress: 'tâches livrées : {n} sur {total}', prio: { low: 'priorité basse', normal: 'priorité normale', high: 'priorité haute' },
        reset: 'revient {time}',
        states: { starting: 'démarrage', working: 'au travail', waiting: 'en attente', handover: 'relève', done: 'terminée', stopped: 'arrêtée' } },
};
let T = TEXT.en;
const fill = (text, vars) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const $ = (id) => document.getElementById(id);

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child !== null && child !== undefined && child !== false) node.append(child);
  return node;
}

function toast(text) {
  const box = $('toast');
  box.textContent = text;
  box.classList.add('show');
  setTimeout(() => box.classList.remove('show'), 2500);
}

async function act(path, body, okText, button) {
  if (button) button.disabled = true;
  try {
    const reply = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Relaylead-Token': TOKEN }, body: JSON.stringify(body) });
    const data = await reply.json();
    toast(reply.ok ? okText : data.message || data.error);
  } catch {
    toast(T.offline);
  }
  refresh();
}

function time(iso) {
  const date = new Date(iso);
  return date.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}

function meter(label, window) {
  if (!window) return null;
  const percent = Math.round(window.percent);
  const level = percent >= 85 ? 'bad' : percent >= 65 ? 'warn' : '';
  return el('div', { class: 'meter', title: window.resetsAt ? fill(T.reset, { time: time(window.resetsAt) }) : '' },
    el('div', { class: 'label' }, el('span', {}, label), el('span', {}, percent + ' %')),
    el('div', { class: 'bar' }, el('i', { class: level, style: 'width:' + Math.min(100, percent) + '%' })));
}

function questionBlock(mission, question) {
  const options = question.options.map((option, index) =>
    el('button', { class: index + 1 === question.recommended ? 'rec' : '', title: index + 1 === question.recommended ? T.recommended : '',
      onclick: (event) => act('/api/answer', { mission: mission.name, id: question.id, choice: index + 1 }, T.sent, event.target) }, option));
  // A free answer, except for the questions of the hooks (irreversible action, permission): options only.
  const canOther = !/^q-(irr|perm)-/.test(question.id);
  const field = el('input', { type: 'text', placeholder: T.other, 'aria-label': T.other });
  const sendOther = (event) => field.value.trim() && act('/api/answer', { mission: mission.name, id: question.id, other: field.value.trim() }, T.sent, event.target);
  field.addEventListener('keydown', (event) => { if (event.key === 'Enter') sendOther({ target: null }); });
  return el('div', { class: 'question' },
    el('div', { class: 'ask' }, question.text),
    question.context ? el('div', { class: 'why' }, question.context) : null,
    el('div', { class: 'options' }, ...options),
    canOther ? el('div', { class: 'other' }, field, el('button', { onclick: sendOther }, T.send)) : null);
}

function missionCard(mission) {
  const delivered = mission.tasks.filter((task) => task.state === 'delivered').length;
  const shownState = mission.pausedUntil ? 'paused' : mission.state.split(/[ ,]/)[0];
  const stateText = mission.pausedUntil ? fill(T.paused, { time: time(mission.pausedUntil) }) : T.states[shownState] || mission.state;
  return el('section', { class: 'card' },
    el('div', { class: 'card-head' },
      el('h2', {}, mission.name),
      el('span', { class: 'pill s-' + shownState }, stateText),
      el('div', { class: 'dir mono' }, mission.dir)),
    el('div', { class: 'meta' },
      el('span', { class: 'tag ' + mission.priority }, T.prio[mission.priority] || mission.priority),
      el('span', { style: 'flex:1' }),
      mission.active ? el('button', { class: 'stop', onclick: (event) => confirm(fill(T.confirmStop, { name: mission.name })) && act('/api/stop', { mission: mission.name }, T.stopped, event.target) }, T.stop) : null),
    ...mission.questions.map((question) => questionBlock(mission, question)),
    mission.tasks.length ? el('div', { class: 'progress' },
      el('div', { class: 'label' }, fill(T.progress, { n: delivered, total: mission.tasks.length })),
      el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.round((100 * delivered) / mission.tasks.length) + '%' }))) : null,
    mission.tasks.length ? el('ul', { class: 'tasks' }, ...mission.tasks.map((task) =>
      el('li', {}, el('span', { class: 'dot t-' + task.state }), el('span', { class: 'name' }, task.title), el('span', { class: 'state' }, T[task.state] || task.state)))) : null);
}

function render(data) {
  T = TEXT[data.language] || TEXT.en;
  document.documentElement.lang = data.language === 'fr' ? 'fr' : 'en';
  const active = data.missions.filter((mission) => mission.active);
  // A finished mission with a question still open (a merge conflict) stays among the active cards.
  const shown = data.missions.filter((mission) => mission.active || mission.questions.length > 0);
  const finished = data.missions.filter((mission) => !shown.includes(mission));
  $('summary').replaceChildren(el('b', {}, String(active.length)), ' ' + T.missions + ' · ', el('b', {}, String(data.openQuestions)), ' ' + T.questions);
  $('quota').replaceChildren(...[data.usage && meter(T.fiveHour, data.usage.fiveHour), data.usage && meter(T.sevenDay, data.usage.sevenDay)].filter(Boolean));
  const main = [];
  // Missions with a question come first: they wait for the person.
  shown.sort((a, b) => b.questions.length - a.questions.length);
  if (data.missions.length === 0) {
    main.push(el('div', { class: 'empty' }, el('p', {}, T.none), el('p', {}, T.start + ' ', el('code', { class: 'mono' }, 'relaylead launch'))));
  } else {
    main.push(el('div', { class: 'grid' }, ...shown.map(missionCard)));
  }
  if (finished.length) main.push(el('details', { class: 'finished' }, el('summary', {}, T.finished + ' (' + finished.length + ')'), el('div', { class: 'grid' }, ...finished.map(missionCard))));
  const open = document.querySelector('details.finished[open]');
  $('main').replaceChildren(...main);
  if (open) document.querySelector('details.finished').open = true;
  document.title = (data.openQuestions ? '(' + data.openQuestions + ') ' : '') + 'Relaylead';
}

let lastSeen = '';
async function refresh() {
  try {
    const reply = await fetch('/api/overview', { cache: 'no-store' });
    const data = await reply.json();
    // Nothing is redrawn when nothing changed, so a click is never lost to a redraw.
    const seen = JSON.stringify({ ...data, generatedAt: 0 });
    if (seen !== lastSeen) render(data);
    lastSeen = seen;
    $('live').textContent = T.live;
    $('live').classList.remove('off');
    $('updated').textContent = fill(T.updated, { time: new Date().toLocaleTimeString() });
  } catch {
    $('live').textContent = T.offline;
    $('live').classList.add('off');
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
